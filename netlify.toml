[build]
  functions = "netlify/functions"
[functions]
  directory = "netlify/functions"

[functions."updateResults"]
  schedule = "*/2 * * * *"

[functions."syncPlayoffOdds"]
  schedule = "*/10 * * * *"

[[headers]]
  for = "/version.json"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
